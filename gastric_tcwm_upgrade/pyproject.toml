[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stageworld-tcwm"
version = "0.1.0"
description = "Treatment-contextualized stochastic landmark prediction extension for Generated651"
requires-python = ">=3.11"
dependencies = ["torch>=2.1", "numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tcwm = "stageworld_tcwm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
