name: CPU Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: gastric_tcwm_upgrade
            extras: dev
          - project: breast_world_joint
            extras: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public files
        run: python tools/check_publication.py
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.5' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e './${{ matrix.project }}[${{ matrix.extras }}]'
      - name: Run tests
        working-directory: ${{ matrix.project }}
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m pytest -q
